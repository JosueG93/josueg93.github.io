<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Josue Gamez · Analista de Datos Senior</title>
<meta name="description" content="Portafolio de Josue Gamez, Analista de Datos Senior especializado en Business Intelligence, Power BI y People Analytics.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<div class="shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><span id="brand-initials">JG</span></div>
    <nav class="sidenav" id="sidenav">
      <a href="#perfil"><span class="idx">01</span> Perfil</a>
      <a href="#habilidades"><span class="idx">02</span> Habilidades</a>
      <a href="#experiencia"><span class="idx">03</span> Experiencia</a>
      <a href="#certificaciones"><span class="idx">04</span> Certificaciones</a>
      <a href="#proyectos"><span class="idx">05</span> Proyectos</a>
      <a href="#contacto"><span class="idx">06</span> Contacto</a>
    </nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>

  <!-- MAIN -->
  <main>

    <!-- HERO -->
    <section class="hero" id="perfil">
      <div class="avatar-ring"><div class="avatar" id="hero-avatar"></div></div>
      <div>
        <div class="kicker"><span id="hero-kicker-dot">●</span> <span id="hero-status">Cargando…</span></div>
        <h1 id="hero-name">&nbsp;</h1>
        <p class="subtitle" id="hero-title"></p>
        <p class="bio" id="hero-bio"></p>
        <div class="meta-row" id="hero-meta"></div>
        <div class="cta-row" id="hero-cta"></div>
      </div>
    </section>

    <div class="stat-strip" id="stat-strip"></div>

    <!-- HABILIDADES -->
    <section class="section" id="habilidades">
      <div class="section-head"><span class="num mono">02</span><h2>Habilidades y herramientas</h2></div>
      <div class="skills-table" id="skills-table">
        <div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>
      </div>
    </section>

    <!-- EXPERIENCIA -->
    <section class="section" id="experiencia">
      <div class="section-head"><span class="num mono">03</span><h2>Experiencia laboral</h2></div>
      <div class="timeline" id="timeline"></div>
    </section>

    <!-- CERTIFICACIONES -->
    <section class="section" id="certificaciones">
      <div class="section-head"><span class="num mono">04</span><h2>Diplomas y certificaciones</h2></div>
      <div class="certs-list" id="certs-list">
        <div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>
      </div>
    </section>

    <!-- PROYECTOS -->
    <section class="section" id="proyectos">
      <div class="section-head"><span class="num mono">05</span><h2>Proyectos</h2></div>
      <div class="projects-grid" id="projects-grid"></div>
    </section>

    <!-- CONTACTO -->
    <section class="section" id="contacto">
      <div class="section-head"><span class="num mono">06</span><h2>Contacto</h2></div>
      <div class="contact-grid" id="contact-grid"></div>
    </section>

    <footer id="footer"></footer>

  </main>
</div>

<script src="script.js"></script>
</body>
</html>
